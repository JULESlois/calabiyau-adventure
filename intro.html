<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡拉比丘 · 弦间冒险 | Calabiyau Stringbound</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0e1a'/%3E%3Cpath d='M8 2 L11 6 L8 14 L5 6 Z' fill='%23ff8ad0'/%3E%3Cpath d='M8 4 L9.5 6.5 L8 11 L6.5 6.5 Z' fill='%23aef4ff'/%3E%3C/svg%3E" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #0b0e1a;
        color: #e8e4dc;
      }

      .intro {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .bg-layer {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0b0e1a 0%, #1a1428 60%, #2d1a2e 100%);
      }

      .stars {
        position: absolute;
        inset: 0;
        opacity: 0.4;
      }

      .star {
        position: absolute;
        width: 1px;
        height: 1px;
        background: #aef4ff;
        box-shadow: 0 0 2px #aef4ff;
        animation: twinkle 3s ease-in-out infinite;
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      .moon {
        position: absolute;
        top: 8%;
        right: 15%;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffe8d0 0%, #ffcfa0 40%, #d4a574 100%);
        box-shadow: 0 0 60px rgba(255, 200, 150, 0.5), inset -15px -15px 30px rgba(0, 0, 0, 0.2);
        opacity: 0.9;
      }

      .content {
        position: relative;
        z-index: 10;
        text-align: center;
        max-width: 560px;
        padding: 0 24px;
      }

      .logo-area {
        margin-bottom: 48px;
      }

      .logo-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        position: relative;
      }

      .logo-icon::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #ff8ad0 0%, #aef4ff 100%);
        clip-path: polygon(50% 10%, 70% 35%, 50% 85%, 30% 35%);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #ff8ad0 0%, #aef4ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        font-size: 1.125rem;
        color: #9ca3af;
        letter-spacing: 0.05em;
        margin-bottom: 12px;
      }

      .tagline {
        font-size: 0.875rem;
        color: #6b7280;
        font-style: italic;
      }

      .description {
        margin: 32px 0 48px;
        line-height: 1.7;
        color: #d1d5db;
        font-size: 0.9375rem;
      }

      .description p {
        margin-bottom: 16px;
      }

      .description p:last-child {
        margin-bottom: 0;
      }

      .cta {
        display: inline-block;
        padding: 16px 48px;
        background: linear-gradient(135deg, #ff8ad0 0%, #d06fa8 100%);
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 4px 20px rgba(255, 138, 208, 0.3);
      }

      .cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 28px rgba(255, 138, 208, 0.45);
      }

      .cta:active {
        transform: translateY(0);
      }

      .note {
        margin-top: 40px;
        font-size: 0.8125rem;
        color: #6b7280;
        line-height: 1.6;
      }

      .castle-silhouette {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 30%;
        background: linear-gradient(to top, #050508 0%, transparent 100%);
        opacity: 0.6;
      }

      @media (max-width: 640px) {
        h1 { font-size: 2rem; }
        .subtitle { font-size: 1rem; }
        .description { font-size: 0.875rem; margin: 24px 0 36px; }
        .moon { width: 100px; height: 100px; top: 6%; right: 8%; }
        .logo-icon { width: 64px; height: 64px; }
      }
    </style>
  </head>
  <body>
    <div class="intro">
      <div class="bg-layer"></div>
      <div class="stars" id="stars"></div>
      <div class="moon"></div>
      <div class="castle-silhouette"></div>

      <div class="content">
        <div class="logo-area">
          <div class="logo-icon"></div>
          <h1>弦间冒险</h1>
          <p class="subtitle">Calabiyau Stringbound</p>
          <p class="tagline">卡拉比丘同人银河城式横板冒险</p>
        </div>

        <div class="description">
          <p>
            <!-- 下面这两个数字由 npm run check:maps 与世界数据对账,改版后不同步会导致构建失败 -->
            6 个区域、58 个互联房间,在恶魔城式哥特像素世界中探索与战斗。操控米雪儿与香奈美,借助弦化能力穿越弦膜、贴墙攀升、二段跳跃,逐步解锁深藏的区域与隐秘的遗珍。
          </p>
          <p>
            可破坏墙、碎裂平台、荆棘与冰面构成地形语言;四场 Boss 战与九类敌人分守其间。
          </p>
          <p>
            程序化生成的像素美术与芯片音乐,零图片素材、零游戏引擎依赖 —— 纯 Canvas 与 TypeScript 构建的能力驱动探索体验。
          </p>
        </div>

        <a href="/" class="cta">开始冒险</a>

        <p class="note">
          同人作品 · 非官方 · 仅供学习交流<br>
          支持键盘与手柄操作
        </p>
      </div>
    </div>

    <script>
      const starsContainer = document.getElementById('stars');
      const starCount = 80;

      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 70 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        starsContainer.appendChild(star);
      }
    </script>
  </body>
</html>
